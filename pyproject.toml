[project]
name = "flask-api-demo"
version = "1.0.0"
description = "flask demo"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "flask-openapi[swagger]==5.0.0",
    "MarkupSafe==3.0.3",
    "Werkzeug==3.1.8",
    "Flask-JWT-Extended==4.7.3",
    "PyJWT==2.12.1",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Cors==6.0.2",
    "SQLAlchemy==2.0.49",
    "pydantic[email]==2.13.4",
    "python-dotenv==1.2.2",
    "psycopg2-binary==2.9.12",
    "rq==2.8.0",
    "redis==7.4.0",
    "geoalchemy2[shapely]==0.19.0",
    "ruff>=0.15.12",
]

[dependency-groups]
ruff = ["ruff"]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "I", # Import related rules - 处理 import 语句相关的规则，如排序、分组等
    "E4", # Import order - 导入语句的排序问题
    "E7", # Statement issues - 语句相关的问题，如不必要的 pass、return 等
    "E9", # Runtime errors - 运行时错误，如语法错误等
    "F", # Pyflakes rules - Pyflakes 检测到的问题，如未使用的变量、未定义的名称等
    "Q", # flake8-quotes
    "UP045", # Use X | None for type annotations
]
